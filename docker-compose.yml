volumes:
  langgraph-data:
    driver: local
  knowledge-data:
    driver: local
services:
  langgraph-redis:
    image: docker.io/redis:6
    healthcheck:
      test: redis-cli ping
      interval: 5s
      timeout: 1s
      retries: 5
  langgraph-postgres:
    image: docker.io/postgres:16
    ports:
      - '5433:5432'
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - langgraph-data:/var/lib/postgresql/data
    healthcheck:
      test: pg_isready -U postgres
      start_period: 10s
      timeout: 1s
      retries: 5
      interval: 5s
  # Derived knowledge index (X42). Kept separate from the orchestration checkpoint store.
  knowledge-postgres:
    image: docker.io/pgvector/pgvector:pg16
    ports:
      - '5434:5432'
    environment:
      POSTGRES_DB: knowledge
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - knowledge-data:/var/lib/postgresql/data
    healthcheck:
      test: pg_isready -U postgres -d knowledge
      start_period: 10s
      timeout: 1s
      retries: 5
      interval: 5s
  langgraph-api:
    build:
      context: .
      dockerfile: Dockerfile
      target: langgraph-api
    image: chat-gun
    expose:
      - '8000'
    depends_on:
      langgraph-redis:
        condition: service_healthy
      langgraph-postgres:
        condition: service_healthy
      knowledge-postgres:
        condition: service_healthy
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-qwen}
      QWEN_BASE_URL: ${QWEN_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      QWEN_API_KEY: ${QWEN_API_KEY}
      QWEN_CHAT_MODEL: ${QWEN_CHAT_MODEL:-qwen-plus}
      QWEN_RESEARCH_MODEL: ${QWEN_RESEARCH_MODEL:-qwen-plus}
      QWEN_VISION_MODEL: ${QWEN_VISION_MODEL:-qwen-vl-plus}
      QWEN_TOOL_MODEL: ${QWEN_TOOL_MODEL:-qwen-plus}
      DEFAULT_MODEL: ${DEFAULT_MODEL:-qwen-plus}
      CHAT_MODEL: ${CHAT_MODEL:-qwen-plus}
      MATH_MODEL: ${MATH_MODEL:-qwen-plus}
      MCP_AGENT_MODEL: ${MCP_AGENT_MODEL:-qwen-plus}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY}
      LANGSMITH_TRACING: 'false'
      OPIK_ENABLED: ${OPIK_ENABLED:-false}
      OPIK_API_KEY: ${OPIK_API_KEY:-}
      OPIK_WORKSPACE: ${OPIK_WORKSPACE:-}
      OPIK_HOST: ${OPIK_HOST:-https://www.comet.com/opik/api}
      OPIK_PROJECT_NAME: ${OPIK_PROJECT_NAME:-chat-gun}
      OPIK_REDACT_ENABLED: ${OPIK_REDACT_ENABLED:-true}
      REDIS_URI: redis://langgraph-redis:6379
      POSTGRES_URI: postgres://postgres:postgres@langgraph-postgres:5432/postgres?sslmode=disable
      DATABASE_URL: postgres://postgres:postgres@langgraph-postgres:5432/postgres?sslmode=disable
      # 知識庫（X42）：連線字串經 SecretBroker 解析；rerank URL 含 workspace 與地域，未設定時降級為 recall-only
      KNOWLEDGE_DATABASE_URL: ${KNOWLEDGE_DATABASE_URL:-postgres://postgres:postgres@knowledge-postgres:5432/knowledge?sslmode=disable}
      KB_RERANK_URL: ${KB_RERANK_URL:-}
      KB_CORPUS_TENANT_ID: ${KB_CORPUS_TENANT_ID:-public}
      # Synthetic demo binding is opt-in; reset by changing epoch and restarting.
      SHOPPING_ORDER_BINDING_ENABLED: ${SHOPPING_ORDER_BINDING_ENABLED-false}
      SHOPPING_ORDER_BINDING_SOURCE_TENANT: ${SHOPPING_ORDER_BINDING_SOURCE_TENANT:-}
      SHOPPING_ORDER_BINDING_SOURCE_PRINCIPAL: ${SHOPPING_ORDER_BINDING_SOURCE_PRINCIPAL:-}
      SHOPPING_ORDER_BINDING_TARGET_TENANT: ${SHOPPING_ORDER_BINDING_TARGET_TENANT:-}
      SHOPPING_ORDER_BINDING_TARGET_OWNER: ${SHOPPING_ORDER_BINDING_TARGET_OWNER:-}
      SHOPPING_ORDER_BINDING_EPOCH: ${SHOPPING_ORDER_BINDING_EPOCH:-}
      # MCP 設定
      MCP_LOAD_ON_START: ${MCP_LOAD_ON_START}
      DEEP_RESEARCHER_MCP_ENABLED: ${DEEP_RESEARCHER_MCP_ENABLED}
      MCP_FILESYSTEM_ENABLED: ${MCP_FILESYSTEM_ENABLED}
      MCP_FILESYSTEM_PATH: ${MCP_FILESYSTEM_PATH}
      MCP_BRAVE_SEARCH_ENABLED: ${MCP_BRAVE_SEARCH_ENABLED}
      BRAVE_API_KEY: ${BRAVE_API_KEY}
      TAVILY_API_KEY: ${TAVILY_API_KEY}
  bff:
    build:
      context: .
      dockerfile: Dockerfile
      target: bff
    image: chat-gun-bff
    ports:
      - '8123:8000'
    depends_on:
      - langgraph-api
    environment:
      BFF_PORT: 8000
      BFF_LANGGRAPH_API_URL: http://langgraph-api:8000
      BFF_ALLOWED_ORIGINS: ${BFF_ALLOWED_ORIGINS:-}
      BFF_REQUIRE_AUTH: ${BFF_REQUIRE_AUTH:-false}
      BFF_API_KEYS: ${BFF_API_KEYS:-}
      BFF_MAX_BODY_BYTES: ${BFF_MAX_BODY_BYTES:-1048576}
      BFF_UPSTREAM_TIMEOUT_MS: ${BFF_UPSTREAM_TIMEOUT_MS:-120000}
      BFF_RATE_LIMIT_WINDOW_MS: ${BFF_RATE_LIMIT_WINDOW_MS:-60000}
      BFF_RATE_LIMIT_MAX_REQUESTS: ${BFF_RATE_LIMIT_MAX_REQUESTS:-120}
