name: chat-gun-runtime-spike

x-ledger: &ledger
  DEMO_ENABLED: "true"
  USAGE_LEDGER_REDIS_URI: redis://ledger:6379
  USAGE_LEDGER_KEY_PREFIX: spike-mit-langgraph-server:run-001
  USAGE_LEDGER_TIME_ZONE:

services:
  runtime:
    image: chat-gun-runtime-spike:local
    build:
      context: ../..
      dockerfile: deploy/self-hosted-runtime/Dockerfile
      target: runtime
    environment:
      <<: *ledger
      LLM_PROVIDER:
      QWEN_BASE_URL:
      QWEN_API_KEY:
      TAVILY_API_KEY:
      BRAVE_API_KEY:
      QWEN_CHAT_MODEL:
      QWEN_RESEARCH_MODEL:
      QWEN_VISION_MODEL:
      QWEN_TOOL_MODEL:
      DEFAULT_MODEL:
      CHAT_MODEL:
      MATH_MODEL:
      MCP_AGENT_MODEL:
      SHOPPING_ASSISTANT_MODEL:
      SHOPPING_ASSISTANT_THINKING_ENABLED: "false"
      SHOPPING_ORDER_BINDING_ENABLED:
      SHOPPING_ORDER_BINDING_SOURCE_TENANT:
      SHOPPING_ORDER_BINDING_SOURCE_PRINCIPAL:
      SHOPPING_ORDER_BINDING_TARGET_TENANT:
      SHOPPING_ORDER_BINDING_TARGET_OWNER:
      SHOPPING_ORDER_BINDING_EPOCH:
      CHAT_THINKING_ENABLED:
      USAGE_LEDGER_WRITE_TIMEOUT_MS:
      USAGE_PRICE_TABLE_JSON:
      DATABASE_URL: ${SPIKE_DATABASE_URL:-}
      KNOWLEDGE_DATABASE_URL: ${SPIKE_DATABASE_URL:-}
      LANGSMITH_TRACING: "false"
      OPIK_ENABLED: "false"
      MCP_LOAD_ON_START: "false"
      DEEP_RESEARCHER_MCP_ENABLED: "false"
    volumes:
      - runtime-data:/app/backend/.langgraph_api
    depends_on:
      ledger:
        condition: service_healthy
      knowledge-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+process.env.RUNTIME_PORT+'/ok').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
    stop_grace_period: 15s

  bff:
    image: chat-gun-runtime-spike-bff:local
    build:
      context: ../..
      dockerfile: deploy/self-hosted-runtime/Dockerfile
      target: bff
    ports:
      - "127.0.0.1:8124:8000"
    environment:
      <<: *ledger
      BFF_LANGGRAPH_API_URL: http://runtime:8000
      BFF_ALLOWED_ORIGINS:
      BFF_TRUSTED_PROXIES: ""
      BFF_UPSTREAM_TIMEOUT_MS:
      BFF_RATE_LIMIT_USER_MAX_REQUESTS:
      BFF_RATE_LIMIT_USER_WINDOW_MS:
      BFF_RATE_LIMIT_IP_MAX_REQUESTS:
      BFF_RATE_LIMIT_IP_WINDOW_MS:
      DEMO_SESSION_SECRET:
      DEMO_SESSION_LIFETIME_MS:
      DEMO_BUDGET_CURRENCY:
      DEMO_BUDGETS_JSON:
      DEMO_GRAPH_BUDGETS_JSON:
      DEMO_BUDGET_TIMEOUT_MS:
      DEMO_LEASE_TTL_MS:
      DEMO_CONCURRENCY_LIMIT:
      DEMO_RESEARCH_IP_DAILY_RUNS:
    depends_on:
      runtime:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+process.env.BFF_PORT+'/api/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12

  ledger:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ledger-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 2s
      retries: 10

  knowledge-postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB:
      POSTGRES_USER:
      POSTGRES_PASSWORD:
    volumes:
      - knowledge-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 2s
      retries: 10

volumes:
  runtime-data:
  ledger-data:
  knowledge-data:
